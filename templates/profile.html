{% extends "base.html" %}
{% block layout %}narrow{% endblock %}
{% block content %}
<section class="panel">
  <h1>My profile</h1>
  <dl>
    <dt>Username</dt><dd>{{ user.username }}</dd>
    <dt>Role</dt><dd>{{ user.get_role_display }}</dd>
  </dl>
  <p>View and update your account details below.</p>
  <form method="post" action="{% url 'profile' %}" class="account-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
    <a href="{% url 'dashboard' %}">Back to dashboard</a>
  </form>
</section>
{% endblock %}
