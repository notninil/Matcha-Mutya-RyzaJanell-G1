{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title|default:"Account" }}{% endblock %} · MatchaTrail</title>
<link rel="stylesheet" href="{% static 'account.css' %}">
</head>
<body>
<header>
  <nav aria-label="Main navigation">
    <a class="brand" href="{% url 'register' %}">MatchaTrail</a>
  </nav>
</header>
<main class="{% block layout %}{% endblock %}">
  {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
